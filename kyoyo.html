<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}a.brand{text-decoration:none}</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>教養コース</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 紙芝居の木の舞台（butai）を中心に、コース地図 → 紙芝居 → 確認テスト → 結果 の4画面を切り替える */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1c2632; --muted:#5a6776; --line:#d3dae2;
  --ai:#2a4a8a; --ai-soft:#e2e9f6; --ok:#2c7a4c; --ok-soft:#e1f1e7; --ng:#b03a3a; --ng-soft:#f7e3e3;
  --wood:#8b5a33; --wood-dark:#5d3a1f; --paper:#fbf8f0; --card-ink:#2a241c; --card-muted:#6b5f50;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#9ba8b5; --line:#2e3843;
  --ai:#8fb0ec; --ai-soft:#1f2c42; --ok:#6fcf97; --ok-soft:#183025; --ng:#ef8a8a; --ng-soft:#3a1f1f;
  --wood:#9c6a3f; --wood-dark:#5a3820; --paper:#ece6d8; --card-ink:#2a241c; --card-muted:#665a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#9ba8b5; --line:#2e3843;
  --ai:#8fb0ec; --ai-soft:#1f2c42; --ok:#6fcf97; --ok-soft:#183025; --ng:#ef8a8a; --ng-soft:#3a1f1f;
  --wood:#9c6a3f; --wood-dark:#5a3820; --paper:#ece6d8; --card-ink:#2a241c; --card-muted:#665a4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.site{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ai);letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:none}
.crumb{font-size:13px;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
h1{font-size:clamp(24px,5vw,32px)}
h2{font-size:20px}
.lead{color:var(--muted);margin:8px 0 0;max-width:36em}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--ai);color:var(--surface);min-height:46px}
.btn.sub{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* コース地図 */
.overall{margin:20px 0 28px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lv{display:grid;grid-template-columns:44px 1fr;gap:14px;position:relative;padding-bottom:22px}
.lv:not(:last-child)::before{content:"";position:absolute;left:21px;top:46px;bottom:0;width:2px;background:var(--line)}
.lv .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.lv.open .num{border-color:var(--ai);color:var(--ai)}
.lv.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.lv .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.lv.locked .body{opacity:.55}
.lv .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;padding:2px 10px;border-radius:99px;white-space:nowrap}
.tag.locked{background:var(--line);color:var(--muted)}
.tag.open{background:var(--ai-soft);color:var(--ai)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.lv p{margin:6px 0 12px;color:var(--muted);font-size:14px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps .btn{padding:9px 14px;min-height:40px;font-size:14px}
.part{margin-top:32px}
.tag.free{background:var(--ok-soft);color:var(--ok)}
.tag.paid{background:var(--paper);color:var(--wood-dark);border:1px solid var(--wood)}
.ptitle .tag{font-size:12px;font-family:var(--f-body)}
.choose{background:var(--ai-soft);border-radius:12px;padding:14px 16px;margin:-6px 0 18px;font-size:14px}
.choose p{margin:0 0 10px}
.choose p:last-child{margin:0}
.choose .hint{font-size:13px;color:var(--muted);align-self:center}
.plan a{color:var(--ai);font-weight:700;margin-left:6px}
.plan{border:1px dashed var(--wood);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);margin:-6px 0 18px}
.ptitle{font-size:22px;display:flex;align-items:center;gap:12px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--line)}
.cert{margin-top:4px;margin-bottom:8px;border:2px solid var(--ok);border-radius:12px;padding:20px;text-align:center;background:var(--ok-soft)}
.cert h2{color:var(--ok)}

/* 紙芝居の舞台 */
.butai{background:linear-gradient(180deg,var(--wood),var(--wood-dark));border-radius:14px;padding:14px;box-shadow:0 10px 24px rgba(40,25,10,.25);margin:18px 0 14px}
.butai .mado{background:var(--wood-dark);border-radius:6px;padding:6px;overflow:hidden;position:relative}
.card{background:var(--paper);color:var(--card-ink);border-radius:4px;min-height:360px;padding:22px 22px 18px;display:grid;grid-template-rows:auto 1fr auto;gap:12px;cursor:pointer;user-select:none}
.card .pg{font-size:12px;color:var(--card-muted);letter-spacing:.08em}
.card .scene{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center}
.card svg{width:96px;height:96px;color:var(--card-ink)}
.card h3{font-size:clamp(20px,4.6vw,26px)}
.card .txt{font-family:var(--f-display);font-size:17px;line-height:1.9;margin:0}
.card .say{font-family:var(--f-display);font-size:15px;border-left:3px solid var(--wood);padding:4px 0 4px 12px;margin:0;color:var(--card-ink)}
.card .say b{font-size:12px;color:var(--card-muted);display:block;font-weight:500}
.card .key{background:#fff3c4;color:var(--card-ink);padding:0 4px;border-radius:3px;font-weight:700}
.card.out{animation:pull .32s ease-in forwards}
.card.in{animation:slidein .3s ease-out}
@keyframes pull{to{transform:translateX(-105%)}}
@keyframes slidein{from{transform:translateX(30%);opacity:0}}
@media (prefers-reduced-motion: reduce){.card.out,.card.in{animation:none}}
@media (max-width:520px){.card .scene{grid-template-columns:1fr}.card svg{width:72px;height:72px}.card{min-height:420px}}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ai)}
.nav{display:flex;justify-content:space-between;gap:10px}

/* 確認テスト */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
.qmeta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.qbox h2{font-size:19px;margin:10px 0 16px}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.6;display:grid;grid-template-columns:28px 1fr;gap:8px}
.choice span.l{font-weight:700;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--ai)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice:disabled{cursor:default}
.fb{margin-top:16px;padding:14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--ok)} .fb.ng strong{color:var(--ng)}

/* 結果 */
.score{font-family:var(--f-display);font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.score small{font-size:20px;color:var(--muted)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:18px;text-align:center}
.result .row{justify-content:center;margin-top:18px}
.review{text-align:left;margin-top:18px;font-size:14px;display:grid;gap:8px}
.review div{padding:10px 12px;border-radius:8px;background:var(--bg)}
.review .x{color:var(--ng);font-weight:700}
.note{font-size:13px;color:var(--muted);margin-top:28px}
</style>

  <main id="app"></main>
</div>

function mergeInto(remote){
  for(const [id, v] of Object.entries(remote || {})){
    const o = prog[id] || (prog[id] = { read:false, passed:false, best:0 });
    o.read = !!(o.read || v.read); o.passed = !!(o.passed || v.passed); o.best = Math.max(o.best || 0, v.best || 0);
  }
}
function st(id){ return prog[id] || (prog[id] = {read:false, passed:false, best:0}); }
function unlocked(id){ const c = COURSE[id-1], p = COURSE[id-2]; if(p && p.part === c.part) return st(p.id).passed; const P = PARTS.find(x => x.name === c.part); return reqDone(P) || (hasPlan(P) && skipped(P)); }
function firstOf(P){ return COURSE.find(c => c.part === P.name); }
function reqDone(P){ return !P.req || COURSE.filter(x => x.part === P.req).every(x => st(x.id).passed); }
function skipped(P){ const f = firstOf(P); return !!(f && prog[f.id] && prog[f.id].skip); }
function isPaid(c){ return !!PARTS.find(x => x.name === c.part).paid; }

async function post(path, body){ const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if(!r.ok) throw new Error(path); return r.json(); }

  const list = COURSE.filter(c => c.part === p.name);
  const pdone = list.every(c => st(c.id).passed);
  h += `<section class="part"><h2 class="ptitle">${p.name}<span class="tag ${p.paid ? 'paid' : 'free'}">${p.paid ? '有料' : '無料'}</span></h2><p class="lead" style="margin:4px 0 16px">${p.lead}</p>${p.paid && !hasPlan(p) ? `<div class="plan">この内容は有料プラン（1年 ${p.price.toLocaleString()}円）で受講できます。<a href="pricing.html">料金を見る</a><a href="pricing.html#code">受講コードを入力</a></div>` : ''}${p.paid && hasPlan(p) && !reqDone(p) && !skipped(p) ? `<div class="choose"><p>購入ありがとうございます。<b>${p.req}</b>を修了してから進むか、${p.req}をとばしてすぐに始めるかを選べます。</p><div class="steps"><button class="btn" data-skip="${p.name}">すぐに始める</button><span class="hint">選ばなければ、${p.req}の修了後に解放されます。${p.req}は、いつでも受講できます。</span></div></div>` : ''}${p.paid && hasPlan(p) && !reqDone(p) && skipped(p) ? `<div class="choose"><p>${p.req}をとばして受講しています。${p.req}も、いつでも受講できます。</p></div>` : ''}<ol class="levels">`;
  list.forEach(c => {
    const s = st(c.id), open = canUse(c.id);
    const cls = s.passed ? 'done' : open ? 'open' : 'locked';
    const tag = s.passed ? `<span class="tag done">合格（${s.best}/${c.quiz.length}）</span>` : open ? `<span class="tag open">受講できます</span>` : `<span class="tag ${unlocked(c.id) ? 'paid' : 'locked'}">${unlocked(c.id) ? '有料プランで受講できます' : lockMsg(c)}</span>`;
    h += `<li class="lv ${cls}"><div class="num">${s.passed ? '✓' : c.id}</div><div class="body">
      <div class="top"><h2>レベル${c.id}　${c.title}</h2>${tag}</div>
      <p>${c.sub}・約${c.mins}分</p>
      <div class="steps">
        <button class="btn ${s.read ? 'sub' : ''}" data-story="${c.id}" ${open ? '' : 'disabled'}>${s.read ? '紙芝居をもう一度' : '紙芝居で学ぶ'}</button>
        <button class="btn ${s.read && !s.passed ? '' : 'sub'}" data-quiz="${c.id}" ${open && s.read ? '' : 'disabled'}>確認テスト</button>
      </div></div></li>`;
  });
  h += `</ol>`;
  if(pdone) h += `<div class="cert"><h2>${p.name} 修了</h2><p>${p.name}の${list.length}レベルすべてに合格しました。おつかれさまでした。</p></div>`;
  h += `</section>`;
  });
  h += `<p class="note">学習の記録は、このブラウザに保存されます。</p>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { const P = PARTS.find(x => x.name === b.dataset.skip); const f = firstOf(P); st(f.id).skip = true; save(); home(); });
  app.querySelectorAll('[data-story]').forEach(b => b.onclick = () => story(+b.dataset.story, 0));
  app.querySelectorAll('[data-quiz]').forEach(b => b.onclick = () => quiz(+b.dataset.quiz));
  window.scrollTo(0,0);
}

function story(id, n, dir){
  if(!canUse(id)) return home();
  const c = COURSE[id-1], s = c.slides[n], last = n === c.slides.length-1;
  crumb.textContent = `レベル${id}　紙芝居`;
  app.innerHTML = `<h1>${c.title}</h1>
  <div class="butai"><div class="mado">
    <div class="card ${dir ? 'in' : ''}" id="card" role="button" tabindex="0" aria-label="次の場面へ">
      <div class="pg">第${n+1}場面 / 全${c.slides.length}場面</div>
      <div class="scene">${ICON[s.i]}<div><h3>${s.h}</h3><p class="txt" style="margin-top:10px">${s.t}</p></div></div>
      <p class="say"><b>${s.who}</b>「${s.say}」</p>
    </div></div></div>
  <div class="dots">${c.slides.map((_,k)=>`<i class="${k<=n?'on':''}"></i>`).join('')}</div>
  <div class="nav">
    <button class="btn sub" id="prev">${n === 0 ? 'コースに戻る' : '前の場面'}</button>
    <button class="btn" id="next">${last ? '確認テストへ' : '次の場面'}</button>
  </div>`;
  const card = document.getElementById('card');
  const go = () => {
    if(last){ st(id).read = true; save(); quiz(id); return; }
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce){ story(id, n+1, 1); return; }
    card.classList.add('out');
    setTimeout(() => story(id, n+1, 1), 300);
  };
  document.getElementById('next').onclick = go;
  card.onclick = go;
  card.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  document.getElementById('prev').onclick = () => n === 0 ? home() : story(id, n-1);
}

function quiz(id){
  if(!canUse(id)) return home();
  const c = COURSE[id-1];
  let i = 0, score = 0; const miss = [];
  crumb.textContent = `レベル${id}　確認テスト`;
  function show(){
    const q = c.quiz[i];
    app.innerHTML = `<h1>確認テスト</h1><p class="lead">レベル${id}「${c.title}」・${c.quiz.length}問中${PASS}問正解で合格</p>
    <div class="qbox"><div class="qmeta"><span>第${i+1}問 / ${c.quiz.length}問</span><span>正解 ${score}</span></div>
    <h2>${q.q}</h2>
    <div class="choices">${q.c.map((t,k)=>`<button class="choice" data-k="${k}"><span class="l">${L[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
    app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.k));
    window.scrollTo(0,0);
  }
  function answer(k){
    const q = c.quiz[i], ok = k === q.a;
    if(ok) score++; else miss.push(i);
    app.querySelectorAll('.choice').forEach(b => {
      b.disabled = true;
      const kk = +b.dataset.k;
      if(kk === q.a) b.classList.add('right');
      else if(kk === k) b.classList.add('wrong');
    });
    const last = i === c.quiz.length-1;
    document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解':'不正解'}</strong>${q.e}</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="nx">${last?'結果を見る':'次の問題'}</button></div>`;
    const nx = document.getElementById('nx'); nx.focus();
    nx.onclick = () => { if(last) result(); else { i++; show(); } };
  }
  function result(){
    const s = st(id), pass = score >= PASS;
    if(pass) s.passed = true;
    s.best = Math.max(s.best, score); save();
    const next = COURSE[id];
    const pdone = COURSE.filter(x => x.part === c.part).every(x => st(x.id).passed);
    const opened = pass && pdone ? PARTS.filter(P => P.req === c.part) : [];
    const goLv = !pass ? null : (next && next.part === c.part) ? next : (opened.length ? COURSE.find(x => x.part === opened[0].name) : null);
    const goPaid = goLv && isPaid(goLv) && !hasPlan(goLv);
    const msg = !pass ? `${PASS}問以上の正解で合格です。紙芝居を見直してから、もう一度挑戦してみましょう。`
      : (next && next.part === c.part) ? `レベル${next.id}「${next.title}」が解放されました。`
      : `${c.part}を修了しました。` + (opened.length ? `${opened.map(o => o.name).join('・')}が解放されました。` : '');
    app.innerHTML = `<h1>テスト結果</h1>
    <div class="result">
      <div class="score">${score}<small> / ${c.quiz.length}問</small></div>
      <h2 style="color:var(${pass?'--ok':'--ng'});margin-top:6px">${pass ? '合格です' : 'もう少しです'}</h2>
      <p class="lead" style="margin-inline:auto">${msg}${goPaid ? 'この先は有料プランで受講できます。' : ''}</p>
      ${miss.length ? `<div class="review">${miss.map(m=>`<div><span class="x">第${m+1}問</span>　${c.quiz[m].q}<br>正解：${esc(c.quiz[m].c[c.quiz[m].a])}</div>`).join('')}</div>` : ''}
      <div class="row">
        ${goLv && !goPaid ? `<button class="btn" id="go">レベル${goLv.id}の紙芝居へ</button>` : ''}
        ${!pass ? `<button class="btn" id="retry">もう一度テスト</button><button class="btn sub" id="reread">紙芝居を見直す</button>` : ''}
        <button class="btn sub" id="back">コースに戻る</button>
      </div></div>`;
    const g = id => document.getElementById(id);
    if(g('go')) g('go').onclick = () => story(goLv.id, 0);
    if(g('retry')) g('retry').onclick = () => quiz(id);
    if(g('reread')) g('reread').onclick = () => story(id, 0);
    g('back').onclick = home;
    window.scrollTo(0,0);
  }
  show();
}
home();
boot();
</script>
