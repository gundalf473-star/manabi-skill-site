<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>ご購入ありがとうございます｜まなびスキル研修室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 木の舞台に紙芝居カードが立つヒーロー → 学び方の3ステップ → 6コースのカード一覧 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1c2632; --muted:#5a6776; --line:#d3dae2;
  --ai:#2a4a8a; --ai-soft:#e2e9f6; --ok:#2c7a4c; --ok-soft:#e1f1e7;
  --wood:#8b5a33; --wood-dark:#5d3a1f; --paper:#fbf8f0; --card-ink:#2a241c; --card-muted:#6b5f50;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#9ba8b5; --line:#2e3843;
  --ai:#8fb0ec; --ai-soft:#1f2c42; --ok:#6fcf97; --ok-soft:#183025;
  --wood:#9c6a3f; --wood-dark:#5a3820; --paper:#ece6d8; --card-ink:#2a241c; --card-muted:#665a4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2129; --ink:#e5eaf0; --muted:#9ba8b5; --line:#2e3843;
  --ai:#8fb0ec; --ai-soft:#1f2c42; --ok:#6fcf97; --ok-soft:#183025;
  --wood:#9c6a3f; --wood-dark:#5a3820; --paper:#ece6d8; --card-ink:#2a241c; --card-muted:#665a4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:1000px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.4}
a{color:inherit}
a:focus-visible{outline:3px solid var(--ai);outline-offset:3px;border-radius:8px}
header.site{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ai);letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
header nav a{font-size:14px;color:var(--muted);text-decoration:none}

/* ヒーロー */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center;padding-block:40px 32px}
.hero h1{font-size:clamp(28px,5.2vw,42px)}
.hero h1 span{color:var(--ai)}
.hero p{color:var(--muted);margin:14px 0 22px;max-width:30em}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--ai);color:var(--surface);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
.butai{background:linear-gradient(180deg,var(--wood),var(--wood-dark));border-radius:14px;padding:14px;box-shadow:0 10px 24px rgba(40,25,10,.25);max-width:440px;justify-self:center;width:100%}
.mado{background:var(--wood-dark);border-radius:6px;padding:6px}
.kami{background:var(--paper);color:var(--card-ink);border-radius:4px;padding:20px;display:grid;gap:10px;min-height:230px;align-content:start}
.kami .pg{font-size:12px;color:var(--card-muted);letter-spacing:.08em}
.kami h3{font-size:21px}
.kami p{margin:0;font-family:var(--f-display);font-size:15px;line-height:1.9}
.kami .say{border-left:3px solid var(--wood);padding-left:10px;font-size:14px}
.kami .say b{display:block;font-size:11px;color:var(--card-muted);font-weight:500}
.kami .hl{background:#fff3c4;font-weight:700;padding:0 3px;border-radius:3px}
.legs{display:flex;justify-content:space-between;padding:0 30px}
.legs i{width:12px;height:22px;background:var(--wood-dark);border-radius:0 0 4px 4px}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:28px 20px}}

/* 学び方 */
.how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:40px}
.how h2{font-size:18px;margin-bottom:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;min-width:0}
.steps li::before{counter-increment:s;content:counter(s);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--ai-soft);color:var(--ai)}
.steps b{display:block;font-family:var(--f-display)}
.steps span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* コース一覧 */
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.list-head h2{font-size:24px}
.list-head small{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.course{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;min-width:0;transition:border-color .15s, transform .15s}
.course:hover{border-color:var(--ai);transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.course{transition:none}.course:hover{transform:none}}
.course .ic{width:48px;height:48px;border-radius:12px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center}
.course .ic svg{width:30px;height:30px}
.course h3{font-size:19px}
.course p{margin:0;font-size:14px;color:var(--muted)}
.course .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.go{color:var(--ai);font-weight:700}
.chip.free{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.paid{background:var(--paper);color:var(--wood-dark);border-color:var(--wood)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style><style>
.ph{padding-block:32px 8px}
.ph h1{font-size:clamp(24px,4.6vw,32px)}
.ph p{color:var(--muted);font-size:14px;margin:8px 0 0}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 24px 20px;max-width:820px}
.doc h2{font-size:18px;margin:24px 0 8px}
.doc p,.doc li{font-size:15px;line-height:1.85}
.doc p{margin:0 0 8px}
.doc ol,.doc ul{margin:0 0 8px;padding-left:1.4em}
.doc .end{color:var(--muted);font-size:14px;margin-top:20px}
</style>
<div class="wrap">
  <header class="site">
    <a class="brand" href="./" style="text-decoration:none">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="6" width="56" height="42" rx="6" fill="#8b5a33"/><rect x="10" y="12" width="44" height="30" rx="2" fill="#fbf8f0"/><rect x="17" y="31" width="7" height="6" rx="1" fill="#2a4a8a"/><rect x="28.5" y="25" width="7" height="12" rx="1" fill="#2a4a8a"/><rect x="40" y="19" width="7" height="18" rx="1" fill="#2a4a8a"/><rect x="12" y="48" width="7" height="10" rx="2" fill="#5d3a1f"/><rect x="45" y="48" width="7" height="10" rx="2" fill="#5d3a1f"/></svg>
      まなびスキル研修室
    </a>
    <nav style="display:flex;gap:16px"><a href="./#courses">コース一覧</a><a href="pricing.html">料金プラン</a></nav>
  </header>
<style>
.done{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;max-width:640px}
.code{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,40px);letter-spacing:.08em;color:var(--ai);background:var(--ai-soft);border-radius:12px;padding:14px 18px;text-align:center;user-select:all;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns button,.btns a{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;background:var(--ai);color:var(--surface);cursor:pointer;text-decoration:none;min-height:46px;display:inline-flex;align-items:center}
.btns .sub{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.note{font-size:14px;color:var(--muted);margin:0}
.err{color:#b03a3a}
</style>
  <section class="ph"><h1>ご購入ありがとうございます</h1><p>お支払いが完了しました。</p></section>
  <div class="done" id="box">
    <p id="status">購入の内容を確認しています…</p>
  </div>
  <footer style="margin-top:32px">まなびスキル研修室　<a href="tokushoho.html">特定商取引法に基づく表記</a>　<a href="privacy.html">プライバシーポリシー</a>　<a href="terms.html">利用規約</a></footer>
</div>

<script>
const API = 'https://api.manabiskill.com';
const NAMES = {security:'情報セキュリティ 中級編',manner:'ビジネスマナー 中級編',compliance:'コンプライアンス 中級編',kaikei:'会計基礎知識 中級編',kyoyo:'教養 中級編',kihon:'基本情報技術者試験',boki2:'簿記2級',fp2:'FP2級'};
const PAGES = {security:'security.html',manner:'manner.html',compliance:'compliance.html',kaikei:'kaikei.html',kyoyo:'kyoyo.html',kihon:'shikaku.html',boki2:'shikaku.html',fp2:'shikaku.html'};
function fmt(iso){ const d = new Date(iso); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
const box = document.getElementById('box');
async function claim(id, tries){
  const r = await fetch(API + '/claim', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id: id }) });
  const d = await r.json().catch(() => ({}));
  if(r.status === 402 && tries > 0){ await new Promise(ok => setTimeout(ok, 3000)); return claim(id, tries - 1); }
  if(!r.ok) throw new Error(d.error || '確認に失敗しました。');
  return d;
}
(async () => {
  const id = new URLSearchParams(location.search).get('session_id');
  if(!id){ box.innerHTML = '<p class="err">購入の情報が見つかりません。<a href="pricing.html">料金プラン</a>のページからお試しください。</p>'; return; }
  try{
    const d = await claim(id, 5);
    try{ localStorage.setItem('manabi-skill-code', d.code); }catch(e){}
    const keys = Object.keys(d.plans || {});
    const first = keys[0];
    box.innerHTML = `
      <p style="margin:0;font-weight:700">あなたの受講コード</p>
      <div class="code" id="code">${d.code}</div>
      <div class="btns"><button type="button" id="copy">コードをコピー</button>${first ? `<a href="${PAGES[first]}">受講を始める</a>` : ''}<a class="sub" href="./">トップページへ</a></div>
      <p class="note" id="copied" aria-live="polite"></p>
      <div><p style="margin:0 0 4px;font-weight:700">受講できるコース</p><ul style="margin:0;padding-left:1.2em">${keys.map(k => `<li>${NAMES[k] || k}：${fmt(d.plans[k])}まで</li>`).join('')}</ul></div>
      <p class="note">このブラウザでは、すぐに受講できます。<b>ほかのパソコンやスマホで受講するときは、<a href="pricing.html#code">料金プランのページ</a>でこの受講コードを入力してください。</b>受講コードは、メモやスクリーンショットで保存しておいてください。</p>
      <p class="note">受講コードを忘れたときは、購入に使ったメールアドレスを添えて manabiskillsite@gmail.com までお問い合わせください。</p>`;
    document.getElementById('copy').addEventListener('click', async () => {
      const out = document.getElementById('copied');
      try{ await navigator.clipboard.writeText(d.code); out.textContent = 'コピーしました。'; }
      catch(e){ const r = document.createRange(); r.selectNodeContents(document.getElementById('code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = 'コードを選択しました。コピーしてください。'; }
    });
  }catch(e){
    box.innerHTML = `<p class="err">${e.message}</p><p class="note">お支払いが済んでいる場合は、このページを開き直すか、manabiskillsite@gmail.com までお問い合わせください。</p>`;
  }
})();
</script>
</html>
